<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Скоро запуск</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #030712;
      --card: rgba(15, 23, 42, 0.65);
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.68);

      --blue: #3b82f6;
      --pink: #ec4899;
      --cyan: #22d3ee;

      --shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(59,130,246,0.15), transparent 30%),
        radial-gradient(circle at bottom right, rgba(236,72,153,0.15), transparent 30%),
        var(--bg);

      color: var(--text);

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    /* Background grid */

    body::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

      background-size: 40px 40px;

      mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
      pointer-events: none;
    }

    .bg-orb {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.55;
      animation: float 12s ease-in-out infinite alternate;
    }

    .orb-1 {
      background: #2563eb;
      top: -120px;
      left: -120px;
    }

    .orb-2 {
      background: #db2777;
      bottom: -150px;
      right: -120px;
      animation-duration: 15s;
    }

    .orb-3 {
      background: #06b6d4;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      opacity: 0.2;
      animation-duration: 18s;
    }

    @keyframes float {
      from {
        transform: translateY(-20px) translateX(-20px);
      }

      to {
        transform: translateY(20px) translateX(20px);
      }
    }

    .container {
      position: relative;
      z-index: 5;

      width: 100%;
      max-width: 520px;

      padding: 48px;

      border-radius: 32px;

      background: var(--card);

      border: 1px solid var(--border);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow: var(--shadow);

      overflow: hidden;

      animation: appear 1s ease;
    }

    .container::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.12),
          transparent 35%
        );

      pointer-events: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 10px 16px;

      border-radius: 999px;

      background: rgba(255,255,255,0.06);

      border: 1px solid rgba(255,255,255,0.08);

      font-size: 13px;
      font-weight: 600;

      color: rgba(255,255,255,0.82);

      margin-bottom: 28px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;

      background: #4ade80;

      box-shadow: 0 0 12px #4ade80;
    }

    h1 {
      font-size: clamp(38px, 5vw, 58px);
      line-height: 1.05;
      font-weight: 800;

      letter-spacing: -2px;

      margin-bottom: 20px;
    }

    .gradient {
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #93c5fd 30%,
        #f9a8d4 70%,
        #ffffff 100%
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 16px;
      line-height: 1.75;

      color: var(--muted);

      margin-bottom: 34px;
    }

    .form-wrapper {
      transition: all .4s ease;
    }

    .input-group {
      position: relative;
      margin-bottom: 14px;
    }

    .input {
      width: 100%;

      padding: 16px 18px;

      border-radius: 16px;

      border: 1px solid rgba(255,255,255,0.08);

      background: rgba(255,255,255,0.05);

      color: #fff;

      font-size: 15px;

      outline: none;

      transition: .3s;
    }

    .input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    .input:focus {
      border-color: rgba(59,130,246,0.6);

      background: rgba(255,255,255,0.08);

      box-shadow:
        0 0 0 4px rgba(59,130,246,0.12),
        0 10px 30px rgba(59,130,246,0.12);
    }

    .btn {
      width: 100%;

      padding: 16px 18px;

      border: none;
      border-radius: 16px;

      cursor: pointer;

      font-size: 15px;
      font-weight: 700;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--pink)
        );

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        opacity .25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);

      box-shadow:
        0 15px 40px rgba(59,130,246,0.28),
        0 10px 30px rgba(236,72,153,0.22);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none;
    }

    .success {
      margin-top: 18px;

      padding: 16px;

      border-radius: 16px;

      background: rgba(74,222,128,0.08);

      border: 1px solid rgba(74,222,128,0.25);

      color: #86efac;

      font-size: 15px;
      line-height: 1.5;

      animation: fade .4s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer {
      position: absolute;
      bottom: 28px;

      font-size: 13px;

      color: rgba(255,255,255,0.3);

      letter-spacing: 0.5px;
    }

    @media (max-width: 640px) {
      .container {
        margin: 20px;
        padding: 32px 24px;
        border-radius: 28px;
      }

      h1 {
        font-size: 38px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="container">

    <div class="badge">
      <div class="badge-dot"></div>
      Скоро запуск
    </div>

    <h1>
      <span class="gradient">
        Мы готовим кое-что действительно мощное
      </span>
    </h1>

    <p>
      Скоро запустим продукт, который изменит привычный опыт.
      Оставь email и узнай обо всём первым.
    </p>

    <button class="btn" id="openForm">
      Узнать первым
    </button>

    <div id="form" class="form-wrapper hidden">

      <div class="input-group">
        <input
          type="email"
          id="email"
          class="input"
          placeholder="Введите ваш email"
        />
      </div>

      <button class="btn" onclick="submitEmail()">
        Получить ранний доступ
      </button>

    </div>

    <div id="success" class="success hidden">
      🚀 Отлично. Вы в списке первых пользователей.
    </div>

  </div>

  <div class="footer">
    © 2026 — All rights reserved
  </div>

  <script>

    const openBtn = document.getElementById('openForm');
    const form = document.getElementById('form');
    const success = document.getElementById('success');

    openBtn.addEventListener('click', () => {

      form.classList.remove('hidden');

      openBtn.style.display = 'none';

      setTimeout(() => {
        document.getElementById('email').focus();
      }, 200);

    });

    function submitEmail() {

      const email = document.getElementById('email').value.trim();

      if (!email || !email.includes('@')) {

        alert('Введите корректный email');

        return;
      }

      form.style.display = 'none';

      success.classList.remove('hidden');
    }

    /* Premium mouse parallax */

    document.addEventListener('mousemove', (e) => {

      const x = (e.clientX / window.innerWidth - 0.5) * 30;
      const y = (e.clientY / window.innerHeight - 0.5) * 30;

      document.querySelector('.orb-1').style.transform =
        `translate(${x}px, ${y}px)`;

      document.querySelector('.orb-2').style.transform =
        `translate(${-x}px, ${-y}px)`;

      document.querySelector('.orb-3').style.transform =
        `translate(calc(-50% + ${x * 0.4}px), calc(-50% + ${y * 0.4}px))`;

    });

  </script>

</body>
</html>
